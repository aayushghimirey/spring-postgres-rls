server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  rls:
    enabled: true
    validation-mode: STRICT
    tables:
      - name: employees
        policies:
          - employee_tenant_isolation
logging:
  level:
    root: info
    io.github.aayushghimirey.spring_postgres_rls: trace
